name: Check

# Reports tests, lint, types and the build on every push and PR to any branch
# except goofy (which holds only prebuilt static assets and has no
# package.json). Every step runs even after one fails, so a single push reports
# everything at once.
#
# This is no longer the only feedback loop -- Node 22 has been on the
# development machine since 2026-09-07, so `npm run checkall` runs locally --
# but it is still the one that runs on a clean checkout.
#
# Keep the push trigger explicit: deployment and CI must start from an ordinary
# branch update without requiring a manual Actions dispatch.

on:
  push:
    branches-ignore: [goofy]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The whole suite. There is no longer a filtered variant: upstream's
      # broken suites were either repaired or removed with the Disneyland and
      # virtual-queue code, so `jest.ci.config.js` had emptied out to the point
      # where it excluded nothing and `test:ci` and `npm test` ran the same
      # tests. Carrying both meant CI ran the suite twice, and the second run
      # was labelled as tolerating failures that no longer existed -- which is
      # exactly the note that would talk someone past a real regression.
      - name: Tests
        id: test
        if: '!cancelled()'
        run: npm run test:ci

      - name: Lint
        id: lint
        if: '!cancelled()'
        run: npm run lint

      - name: Typecheck
        id: typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Build
        id: build
        if: '!cancelled()'
        run: npm run build
