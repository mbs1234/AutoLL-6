name: Dependency audit

on:
  schedule:
    - cron: '23 13 * * 1'
  pull_request:
    paths:
      [
        'package.json',
        'package-lock.json',
        '.github/workflows/dependency-audit.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm audit --audit-level=high
